
<!DOCTYPE html>
<html>
<head>
    <title>Different Paragraph Styles</title>

    <style>
        .p1 {
            color: red;
            font-size: 20px;
        }

        .p2 {
            color: green;
            font-size: 25px;
        }

        .p3 {
            color: blue;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <p class="p1">This is Red Color Paragraph</p>

    <p class="p2">This is Green Color Paragraph</p>

    <p class="p3">This is Blue Color Paragraph</p>

</body>
</html>


<!DOCTYPE html>
<html>
<head>
    <title>Paragraph Styling Using ID</title>

    <style>
        #p1 {
            color: red;
            font-size: 20px;
        }

        #p2 {
            color: green;
            font-size: 25px;
        }

        #p3 {
            color: blue;
            font-size: 30px;
        }

        #p4 {
            color: purple;
            font-size: 35px;
        }
    </style>
</head>

<body>

    <h2>Different Paragraph Styles</h2>

    <p id="p1">This is the First Paragraph.</p>

    <p id="p2">This is the Second Paragraph.</p>

    <p id="p3">This is the Third Paragraph.</p>

    <p id="p4">This is the Fourth Paragraph.</p>

</body>
</html>
